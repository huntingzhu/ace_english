<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hunting's English Flashcards</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-2: #334155;
    --accent: #60a5fa;
    --accent-2: #a78bfa;
    --good: #34d399;
    --warn: #fbbf24;
    --text: #f1f5f9;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e1b4b);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }
  header {
    width: 100%;
    max-width: 720px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 12px;
  }
  h1 {
    font-size: 20px;
    margin: 0;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  h1 .accent { color: var(--accent); }
  .stats {
    font-size: 13px;
    color: var(--muted);
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .stats .pill {
    background: var(--panel);
    padding: 4px 10px;
    border-radius: 999px;
  }
  .stats .pill.good { color: var(--good); }
  .stats .pill.warn { color: var(--warn); }

  .toolbar {
    width: 100%;
    max-width: 720px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .toolbar select,
  .toolbar button,
  .toolbar label.filebtn {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--panel-2);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.15s, transform 0.05s;
  }
  .toolbar button:hover,
  .toolbar label.filebtn:hover { background: var(--panel-2); }
  .toolbar button:active { transform: scale(0.97); }
  .toolbar input[type="file"] { display: none; }

  .card-wrap {
    width: 100%;
    max-width: 720px;
    perspective: 1400px;
  }
  .card {
    position: relative;
    width: 100%;
    min-height: 360px;
    border-radius: 20px;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(.2,.8,.2,1);
    cursor: pointer;
  }
  .card.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    background: linear-gradient(160deg, var(--panel) 0%, #0b1226 100%);
    border: 1px solid var(--panel-2);
    border-radius: 20px;
    padding: 32px 28px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 18px 40px rgba(0,0,0,0.35);
  }
  .face.back { transform: rotateY(180deg); }

  .word-category {
    display: inline-block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--accent);
    background: rgba(96,165,250,0.12);
    padding: 3px 10px;
    border-radius: 999px;
    align-self: flex-start;
  }
  .word-text {
    font-size: 42px;
    font-weight: 700;
    margin: 20px 0 10px 0;
    line-height: 1.1;
    word-wrap: break-word;
  }
  .phonetic {
    font-size: 18px;
    color: var(--muted);
    margin-bottom: 8px;
    font-family: "Menlo", "Consolas", monospace;
  }
  .date-added {
    font-size: 12px;
    color: var(--muted);
    margin-top: auto;
  }
  .hint {
    font-size: 13px;
    color: var(--muted);
    margin-top: 16px;
    font-style: italic;
  }
  .translation {
    font-size: 26px;
    font-weight: 600;
    color: var(--accent-2);
    margin: 10px 0 14px 0;
    line-height: 1.3;
  }
  .example-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--muted);
    margin-top: 4px;
  }
  .example-text {
    font-size: 17px;
    line-height: 1.55;
    margin: 6px 0 18px 0;
    padding: 12px 14px;
    background: rgba(255,255,255,0.04);
    border-left: 3px solid var(--accent);
    border-radius: 6px;
  }
  .actions {
    margin-top: auto;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .actions .btn {
    background: var(--panel-2);
    color: var(--text);
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.15s, transform 0.05s;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .actions .btn:hover { background: #475569; }
  .actions .btn:active { transform: scale(0.97); }
  .actions .btn.primary { background: var(--accent); color: #0b1226; font-weight: 600; }
  .actions .btn.primary:hover { background: #93c5fd; }
  .actions .btn.good { background: var(--good); color: #052e1f; font-weight: 600; }
  .actions .btn.good:hover { background: #6ee7b7; }
  .actions .btn.warn { background: var(--warn); color: #3b2a05; font-weight: 600; }
  .actions .btn.warn:hover { background: #fcd34d; }

  footer {
    width: 100%;
    max-width: 720px;
    margin-top: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  footer .nav {
    display: flex;
    gap: 8px;
  }
  footer .nav button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--panel-2);
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 14px;
    cursor: pointer;
  }
  footer .nav button:hover { background: var(--panel-2); }
  footer .counter {
    color: var(--muted);
    font-size: 14px;
  }
  .keyboard-tip {
    width: 100%;
    max-width: 720px;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    margin-top: 20px;
    padding: 10px;
    border-top: 1px solid var(--panel-2);
  }
  .keyboard-tip kbd {
    background: var(--panel);
    padding: 2px 8px;
    border-radius: 4px;
    border: 1px solid var(--panel-2);
    font-size: 11px;
    font-family: "Menlo", "Consolas", monospace;
    margin: 0 2px;
  }
  .status-badge {
    position: absolute;
    top: 14px;
    right: 14px;
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 999px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .status-badge.new { background: rgba(148,163,184,0.2); color: var(--muted); }
  .status-badge.learning { background: rgba(251,191,36,0.2); color: var(--warn); }
  .status-badge.known { background: rgba(52,211,153,0.2); color: var(--good); }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 60px 20px;
    font-size: 16px;
  }
</style>
</head>
<body>
  <header>
    <h1><span class="accent">Hunting's</span> English Flashcards</h1>
    <div class="stats">
      <span class="pill" id="stat-total">Total: 0</span>
      <span class="pill warn" id="stat-learning">Learning: 0</span>
      <span class="pill good" id="stat-known">Known: 0</span>
    </div>
  </header>

  <div class="toolbar">
    <select id="filter-category" title="Filter by category">
      <option value="all">All categories</option>
      <option value="word">Words</option>
      <option value="phrase">Phrases</option>
      <option value="idiom">Idioms</option>
      <option value="sentence">Sentences</option>
    </select>
    <select id="filter-status" title="Filter by status">
      <option value="all">All statuses</option>
      <option value="new">New</option>
      <option value="learning">Learning</option>
      <option value="known">Known</option>
      <option value="unknown">Not known (new + learning)</option>
    </select>
    <button id="shuffle-btn" title="Shuffle the deck">Shuffle</button>
    <button id="reset-btn" title="Reset all progress">Reset progress</button>
    <label class="filebtn" title="Load a different CSV">
      Load CSV
      <input type="file" id="file-input" accept=".csv">
    </label>
  </div>

  <div class="card-wrap">
    <div class="card" id="card" onclick="flipCard()">
      <div class="face front">
        <span class="status-badge new" id="status-badge-front">new</span>
        <span class="word-category" id="category-label">word</span>
        <div class="word-text" id="word-text">Loading...</div>
        <div class="phonetic" id="phonetic-text"></div>
        <div class="actions">
          <button class="btn primary" onclick="event.stopPropagation(); speak();">🔊 Pronounce</button>
          <a class="btn" id="image-link" href="#" target="_blank" rel="noopener" onclick="event.stopPropagation();">🖼️ Image</a>
        </div>
        <div class="hint">Tap card or press <kbd>Space</kbd> to flip</div>
        <div class="date-added" id="date-added"></div>
      </div>
      <div class="face back">
        <span class="status-badge new" id="status-badge-back">new</span>
        <div class="translation" id="translation-text"></div>
        <div class="example-label">Example</div>
        <div class="example-text" id="example-text"></div>
        <div class="actions">
          <button class="btn primary" onclick="event.stopPropagation(); speakExample();">🔊 Play sentence</button>
          <button class="btn good" onclick="event.stopPropagation(); markStatus('known');">✓ I know this</button>
          <button class="btn warn" onclick="event.stopPropagation(); markStatus('learning');">↻ Review again</button>
        </div>
        <div class="date-added" id="date-added-back"></div>
      </div>
    </div>
  </div>

  <footer>
    <div class="nav">
      <button onclick="prev()">← Previous</button>
      <button onclick="next()">Next →</button>
    </div>
    <div class="counter" id="counter">0 / 0</div>
  </footer>

  <div class="keyboard-tip">
    <kbd>Space</kbd> flip &nbsp;·&nbsp;
    <kbd>←</kbd> previous &nbsp;·&nbsp;
    <kbd>→</kbd> next &nbsp;·&nbsp;
    <kbd>P</kbd> pronounce &nbsp;·&nbsp;
    <kbd>K</kbd> mark known &nbsp;·&nbsp;
    <kbd>L</kbd> mark learning &nbsp;·&nbsp;
    <kbd>S</kbd> shuffle
  </div>

<script>
// ---------- Embedded fallback CSV (used if ../databases/vocab.csv can't be fetched) ----------
const EMBEDDED_CSV = `"date_added","word","pronunciation","translation","example","category","status"
"2026-04-16","prod","/prɑːd/","生产环境（production 的口语缩写）","Since this is prod, we'll deploy it tomorrow morning.","word","new"

"2025-12-02","kick the bucket","/kɪk ðə ˈbʌkɪt/","死掉（口语，非正式）","That phrase means ""to die,"" but it's very informal.","idiom","new"

"2025-12-02","out of the blue","/aʊt əv ðə bluː/","突然地","He called me out of the blue last night.","idiom","new"
"2025-12-02","break a leg","/breɪk ə leɡ/","祝你好运（演出前常用）","You'll do great in the interview—break a leg!","idiom","new"
"2025-12-02","kick the tires","/kɪk ðə taɪərz/","试探性了解；初步检查","We're just kicking the tires on this new idea.","idiom","new"
"2025-12-02","bite off more than one can chew","/baɪt ɔːf mɔːr ðæn wʌn kæn tʃuː/","贪多嚼不烂","I took on too many tasks and bit off more than I could chew.","idiom","new"
"2025-05-05","bureaucracy","/bjʊˈrɑːkrəsi/","官僚主义；官僚体系","Too much bureaucracy slows everything down.","word","new"
"2025-05-05","red tape","/ˌred ˈteɪp/","繁文缛节；繁琐手续","We wasted weeks dealing with red tape.","idiom","new"`;

// ---------- Minimal RFC-4180-ish CSV parser ----------
function parseCSV(text) {
  const rows = [];
  let cur = [];
  let field = '';
  let inQuotes = false;
  let i = 0;
  while (i < text.length) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i += 2; continue; }
        inQuotes = false; i++; continue;
      }
      field += c; i++; continue;
    } else {
      if (c === '"') { inQuotes = true; i++; continue; }
      if (c === ',') { cur.push(field); field = ''; i++; continue; }
      if (c === '\r') { i++; continue; }
      if (c === '\n') { cur.push(field); rows.push(cur); cur = []; field = ''; i++; continue; }
      field += c; i++; continue;
    }
  }
  if (field.length > 0 || cur.length > 0) { cur.push(field); rows.push(cur); }
  if (rows.length === 0) return [];
  const headers = rows[0].map(h => h.trim());
  return rows.slice(1).filter(r => r.some(v => v && v.length)).map(r => {
    const obj = {};
    headers.forEach((h, idx) => { obj[h] = (r[idx] || '').trim(); });
    return obj;
  });
}

// ---------- State ----------
let allCards = [];
let deck = [];          // filtered + possibly shuffled view
let index = 0;
const STORAGE_KEY = 'hunting_english_progress_v1';

// ---------- Persistence of known/learning status ----------
function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return {};
    return JSON.parse(raw);
  } catch (e) { return {}; }
}
function saveProgress(p) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); } catch (e) {}
}
function keyFor(card) { return card.date_added + '||' + card.word; }

// ---------- Loading ----------
async function loadCSV() {
  try {
    const res = await fetch('../databases/vocab.csv', { cache: 'no-store' });
    if (res.ok) {
      const text = await res.text();
      if (text && text.includes(',')) return parseCSV(text);
    }
  } catch (e) { /* fall through to embedded */ }
  return parseCSV(EMBEDDED_CSV);
}

function applyProgress(cards) {
  const p = loadProgress();
  return cards.map(c => {
    const k = keyFor(c);
    if (p[k]) c.status = p[k];
    return c;
  });
}

// ---------- Filtering / shuffling ----------
function applyFilters() {
  const catFilter = document.getElementById('filter-category').value;
  const statusFilter = document.getElementById('filter-status').value;
  deck = allCards.filter(c => {
    if (catFilter !== 'all' && c.category !== catFilter) return false;
    if (statusFilter === 'unknown') {
      if (c.status === 'known') return false;
    } else if (statusFilter !== 'all' && c.status !== statusFilter) {
      return false;
    }
    return true;
  });
  index = 0;
  render();
}

function shuffle() {
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  index = 0;
  render();
}

// ---------- Render ----------
function updateStats() {
  const total = allCards.length;
  const known = allCards.filter(c => c.status === 'known').length;
  const learning = allCards.filter(c => c.status === 'learning').length;
  document.getElementById('stat-total').textContent = `Total: ${total}`;
  document.getElementById('stat-known').textContent = `Known: ${known}`;
  document.getElementById('stat-learning').textContent = `Learning: ${learning}`;
}

function render() {
  updateStats();
  const card = document.getElementById('card');
  card.classList.remove('flipped');

  if (deck.length === 0) {
    document.getElementById('word-text').textContent = 'No cards';
    document.getElementById('phonetic-text').textContent = '';
    document.getElementById('translation-text').textContent = '';
    document.getElementById('example-text').textContent = 'Try changing the filters above.';
    document.getElementById('category-label').textContent = '';
    document.getElementById('date-added').textContent = '';
    document.getElementById('date-added-back').textContent = '';
    document.getElementById('counter').textContent = '0 / 0';
    document.getElementById('image-link').href = '#';
    return;
  }

  if (index < 0) index = deck.length - 1;
  if (index >= deck.length) index = 0;

  const c = deck[index];
  document.getElementById('word-text').textContent = c.word;
  document.getElementById('phonetic-text').textContent = c.pronunciation || '';
  document.getElementById('translation-text').textContent = c.translation;
  document.getElementById('example-text').textContent = c.example;
  document.getElementById('category-label').textContent = c.category;
  document.getElementById('date-added').textContent = 'Added: ' + c.date_added;
  document.getElementById('date-added-back').textContent = 'Added: ' + c.date_added;
  document.getElementById('counter').textContent = (index + 1) + ' / ' + deck.length;
  document.getElementById('image-link').href =
    'https://www.google.com/search?tbm=isch&q=' + encodeURIComponent(c.word);

  for (const side of ['front', 'back']) {
    const badge = document.getElementById('status-badge-' + side);
    badge.className = 'status-badge ' + (c.status || 'new');
    badge.textContent = c.status || 'new';
  }
}

// ---------- Actions ----------
function flipCard() {
  document.getElementById('card').classList.toggle('flipped');
}
function next() {
  index = (index + 1) % Math.max(deck.length, 1);
  render();
}
function prev() {
  index = (index - 1 + deck.length) % Math.max(deck.length, 1);
  render();
}
function speak() {
  if (deck.length === 0) return;
  const c = deck[index];
  if (!('speechSynthesis' in window)) { alert('Text-to-speech not available in this browser.'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(c.word);
  u.lang = 'en-US';
  u.rate = 0.9;
  speechSynthesis.speak(u);
}
function speakExample() {
  if (deck.length === 0) return;
  const c = deck[index];
  if (!('speechSynthesis' in window)) { alert('Text-to-speech not available in this browser.'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(c.example);
  u.lang = 'en-US';
  u.rate = 0.9;
  speechSynthesis.speak(u);
}
function markStatus(status) {
  if (deck.length === 0) return;
  const c = deck[index];
  c.status = status;
  // update progress store
  const p = loadProgress();
  p[keyFor(c)] = status;
  saveProgress(p);
  updateStats();
  // update badges then advance
  for (const side of ['front', 'back']) {
    const badge = document.getElementById('status-badge-' + side);
    badge.className = 'status-badge ' + status;
    badge.textContent = status;
  }
  setTimeout(next, 250);
}
function resetProgress() {
  if (!confirm('Reset all known/learning progress? (Cards themselves won\'t be deleted.)')) return;
  localStorage.removeItem(STORAGE_KEY);
  allCards.forEach(c => c.status = 'new');
  applyFilters();
}

// ---------- Keyboard shortcuts ----------
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  switch (e.key) {
    case ' ': e.preventDefault(); flipCard(); break;
    case 'ArrowRight': next(); break;
    case 'ArrowLeft': prev(); break;
    case 'p': case 'P': speak(); break;
    case 'k': case 'K': markStatus('known'); break;
    case 'l': case 'L': markStatus('learning'); break;
    case 's': case 'S': shuffle(); break;
  }
});

// ---------- Boot ----------
async function boot() {
  const cards = await loadCSV();
  allCards = applyProgress(cards);
  applyFilters();
}

document.getElementById('filter-category').addEventListener('change', applyFilters);
document.getElementById('filter-status').addEventListener('change', applyFilters);
document.getElementById('shuffle-btn').addEventListener('click', shuffle);
document.getElementById('reset-btn').addEventListener('click', resetProgress);
document.getElementById('file-input').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const text = await file.text();
  allCards = applyProgress(parseCSV(text));
  applyFilters();
});

boot();
</script>
</body>
</html>
